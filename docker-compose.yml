# =============================================================================
# Job Ops - Docker Compose Configuration
# =============================================================================

services:
  job-ops:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    image: ghcr.io/dakheera47/job-ops:latest
    container_name: job-ops
    ports:
      - "3005:3001"
    volumes:
      # Persist database and generated PDFs
      - ./data:/app/data
      # Persist Codex login/session data for app-server provider
      - codex-home:/app/codex-home
      # Persist Tectonic's LaTeX support-bundle cache. Without this, every
      # container recreate re-downloads the support bundle on the first PDF
      # render, which is slow and can fail with HTTP 429 rate-limiting.
      - tectonic-cache:/root/.cache/Tectonic
    environment:
      # Server config
      - NODE_ENV=production
      - PORT=3001

      # Python path (uses system python in container)
      - PYTHON_PATH=/usr/bin/python3
      # Codex runtime home (stores auth and config)
      - CODEX_HOME=/app/codex-home

    env_file:
      - path: ./.env
        required: false
    develop:
      watch:
        # Rebuild container when package.json changes
        - path: ./orchestrator/package.json
          action: rebuild
        - path: ./orchestrator/package-lock.json
          action: rebuild
        # Sync source code changes and rebuild inside container
        - path: ./orchestrator/src
          target: /app/orchestrator/src
          action: sync+restart
        - path: ./visa-sponsor-providers
          target: /app/visa-sponsor-providers
          action: sync+restart
        - path: ./career-boards/bamboohr/src
          target: /app/career-boards/bamboohr/src
          action: sync+restart
        - path: ./career-boards/workday/src
          target: /app/career-boards/workday/src
          action: sync+restart
        - path: ./career-boards/careerops/src
          target: /app/career-boards/careerops/src
          action: sync+restart
        # Sync extractor changes
        - path: ./extractors/gradcracker/src
          target: /app/extractors/gradcracker/src
          action: sync+restart
        - path: ./extractors/hiringcafe/src
          target: /app/extractors/hiringcafe/src
          action: sync+restart
        - path: ./extractors/ukvisajobs/src
          target: /app/extractors/ukvisajobs/src
          action: sync+restart
        - path: ./extractors/workingnomads/src
          target: /app/extractors/workingnomads/src
          action: sync+restart
        - path: ./extractors/golangjobs/src
          target: /app/extractors/golangjobs/src
          action: sync+restart
        - path: ./extractors/jobindex/src
          target: /app/extractors/jobindex/src
          action: sync+restart
        - path: ./extractors/seek/src
          target: /app/extractors/seek/src
          action: sync+restart
        - path: ./extractors/jobspy
          target: /app/extractors/jobspy
          action: sync+restart
        - path: ./extractors/naukri
          target: /app/extractors/naukri
          action: sync+restart
        - path: ./extractors/fiveamsat
          target: /app/extractors/fiveamsat
          action: sync+restart
        - path: ./extractors/wazzuf
          target: /app/extractors/wazzuf
          action: sync+restart
        - path: ./extractors/freehire/src
          target: /app/extractors/freehire/src
          action: sync+restart
        - path: ./extractors/feed-utils/src
          target: /app/extractors/feed-utils/src
          action: sync+restart
        - path: ./extractors/builtin
          target: /app/extractors/builtin
          action: sync+restart
        - path: ./extractors/themuse
          target: /app/extractors/themuse
          action: sync+restart
        - path: ./extractors/hackernews
          target: /app/extractors/hackernews
          action: sync+restart
        - path: ./extractors/remoteok
          target: /app/extractors/remoteok
          action: sync+restart
        - path: ./extractors/remotive
          target: /app/extractors/remotive
          action: sync+restart
        - path: ./extractors/weworkremotely
          target: /app/extractors/weworkremotely
          action: sync+restart
        - path: ./extractors/jobicy
          target: /app/extractors/jobicy
          action: sync+restart
        - path: ./extractors/himalayas
          target: /app/extractors/himalayas
          action: sync+restart
        - path: ./extractors/nodesk
          target: /app/extractors/nodesk
          action: sync+restart
        - path: ./extractors/fourdayweek
          target: /app/extractors/fourdayweek
          action: sync+restart
        - path: ./extractors/cryptocurrencyjobs
          target: /app/extractors/cryptocurrencyjobs
          action: sync+restart
        - path: ./extractors/pythonorg
          target: /app/extractors/pythonorg
          action: sync+restart
        - path: ./extractors/a16zspeedrun
          target: /app/extractors/a16zspeedrun
          action: sync+restart
        - path: ./extractors/agenticjobs
          target: /app/extractors/agenticjobs
          action: sync+restart
        - path: ./extractors/generalistworld
          target: /app/extractors/generalistworld
          action: sync+restart
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

secrets:
  github_token:
    environment: GITHUB_TOKEN

# Volumes for data persistence
volumes:
  data:
  codex-home:
  tectonic-cache:
